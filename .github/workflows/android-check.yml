name: HADIRKU Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-check.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug -PSUPABASE_URL=https://qmmdhjjezuflznapalbo.supabase.co -PSUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
